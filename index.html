<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Application</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <meta name="theme-color" content="#4f46e5">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="./icon.svg" class="w-8 h-8" alt="Logo">
        <h1 class="font-bold text-lg text-indigo-400">PWA Application</h1>
      </div>
      <div id="status-badge" class="px-2 py-1 text-xs rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
        Online
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-md mx-auto p-4 w-full flex-grow flex flex-col gap-4">
    <!-- PWA Install Banner -->
    <div id="install-banner" class="hidden bg-indigo-600/20 border border-indigo-500/30 rounded-xl p-4 flex flex-col gap-3">
      <div class="flex justify-between items-start">
        <div>
          <h2 class="font-semibold text-indigo-300">ติดตั้งแอปพลิเคชัน</h2>
          <p class="text-xs text-slate-300 mt-1">เพิ่มแอปลงในหน้าจอหลักเพื่อการใช้งานที่รวดเร็วและรองรับโหมดออฟไลน์</p>
        </div>
      </div>
      <button id="install-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white py-2 px-4 rounded-lg font-medium text-sm transition">
        ติดตั้งลงเครื่องทันที
      </button>
    </div>

    <!-- Notes Card -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
      <h2 class="font-semibold text-slate-200 mb-3 flex items-center gap-2">
        <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        บันทึกข้อมูล (Offline Notes)
      </h2>
      <textarea id="note-input" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 text-sm focus:outline-none focus:border-indigo-500 mb-3 resize-none h-24" placeholder="พิมพ์ข้อความบันทึกที่นี่... (ข้อมูลจะเซฟอัตโนมัติ)"></textarea>
      <div class="flex justify-between items-center text-xs text-slate-400">
        <span id="save-status">บันทึกอัตโนมัติเรียบร้อย</span>
        <button id="clear-btn" class="text-rose-400 hover:underline">ล้างข้อความ</button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-800/50 text-center py-3 text-xs text-slate-500 border-t border-slate-800">
    PWA Ready for GitHub Pages
  </footer>

  <script>
    // PWA Service Worker Registration using relative path
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered successfully:', reg.scope))
          .catch(err => console.log('SW Registration failed:', err));
      });
    }

    // PWA Install Prompt Handler
    let deferredPrompt;
    const installBanner = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBanner.classList.add('hidden');
      }
      deferredPrompt = null;
    });

    // Network Status Indicator
    const statusBadge = document.getElementById('status-badge');
    function updateOnlineStatus() {
      if (navigator.onLine) {
        statusBadge.textContent = 'Online';
        statusBadge.className = 'px-2 py-1 text-xs rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
      } else {
        statusBadge.textContent = 'Offline';
        statusBadge.className = 'px-2 py-1 text-xs rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30';
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // Auto-save Notes (LocalStorage)
    const noteInput = document.getElementById('note-input');
    const saveStatus = document.getElementById('save-status');
    const clearBtn = document.getElementById('clear-btn');

    noteInput.value = localStorage.getItem('pwa_note') || '';
    noteInput.addEventListener('input', () => {
      localStorage.setItem('pwa_note', noteInput.value);
      saveStatus.textContent = 'กำลังบันทึก...';
      setTimeout(() => { saveStatus.textContent = 'บันทึกเรียบร้อย'; }, 500);
    });

    clearBtn.addEventListener('click', () => {
      noteInput.value = '';
      localStorage.removeItem('pwa_note');
      saveStatus.textContent = 'ล้างข้อมูลแล้ว';
    });
  </script>
</body>
</html>
